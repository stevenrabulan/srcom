name: Build & Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @stevenrabulan/design-system is a private repo, so npm needs the
      # read-only deploy key before it can clone it over SSH.
      - name: Authorize private design-system dependency
        env:
          DEPLOY_KEY: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "DESIGN_SYSTEM_DEPLOY_KEY is not set. npm ci cannot install @stevenrabulan/design-system." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          # ssh -T exits 1 even on success (GitHub gives no shell), so capture
          # the output instead of piping it: pipefail would fail the check.
          auth_output=$(ssh -o BatchMode=yes -T git@github.com 2>&1 || true)
          if ! grep -q "successfully authenticated" <<<"$auth_output"; then
            echo "Deploy key rejected by GitHub: $auth_output" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npm run build

      - name: Deploy to SiteGround via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: out/
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_port: ${{ secrets.REMOTE_PORT }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_PASSWORD }}
